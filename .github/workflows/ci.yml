name: CI

on:
  push:
    branches-ignore:
      - "wip*"
    tags:
      - "v*"
  pull_request:
  schedule:
    # Daily at 8:33
    - cron: "33 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Rust lint & pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust components and tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          cargo install --locked prek cargo-deny cargo-machete
      - name: Run prek
        run: prek run --all-files

  test:
    name: Rust server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run tests
        run: cargo test --workspace --locked

  checks:
    name: Android build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref_name != 'main' }}
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Formatting, detekt, lint, unit tests, release and test builds
        run: ./android/gradlew -p android spotlessCheck detekt :app:lintDebug :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest

  instrumented:
    name: Instrumented tests (${{ matrix.device.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: Pixel 9, API 36
            task: pixel9Api36DebugAndroidTest
          - name: Pixel 10 Pro, API 37
            task: pixel10ProApi37DebugAndroidTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          cache-disabled: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning]
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch the managed device image
        env:
          SETUP: ${{ matrix.device.task }}
        run: |
          setup_task=":app:${SETUP%DebugAndroidTest}Setup"
          extra_flags=""
          for attempt in 1 2 3; do
            ./android/gradlew -p android "$setup_task" $extra_flags -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect && break
            test "$attempt" -lt 3 || exit 1
            pkill -f qemu-system || true
            rm -rf "${ANDROID_HOME:-/usr/local/lib/android/sdk}/.temp"
            extra_flags="--refresh-dependencies"
            sleep 5
          done
      - name: Run instrumented tests on the managed device
        env:
          TASK: ${{ matrix.device.task }}
        run: >
          ./android/gradlew -p android ":app:$TASK"
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: instrumented-test-report-${{ matrix.device.task }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  profile:
    name: Record the baseline profile
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch the managed AOSP device image
        run: |
          extra_flags=""
          for attempt in 1 2 3; do
            ./android/gradlew -p android :baselineprofile:pixel9Api36AospSetup $extra_flags -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect && break
            test "$attempt" -lt 3 || exit 1
            pkill -f qemu-system || true
            rm -rf "${ANDROID_HOME:-/usr/local/lib/android/sdk}/.temp"
            extra_flags="--refresh-dependencies"
            sleep 5
          done
      - name: Record the profile on the managed AOSP emulator
        run: ./android/gradlew -p android :app:generateReleaseBaselineProfile -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile
          path: android/app/src/release/generated/baselineProfiles/
          if-no-files-found: error

  signing:
    name: Check the signing secrets
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          KEY_B64: ${{ secrets.ROCHE_RELEASE_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.ROCHE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" || { echo "::error::ROCHE_RELEASE_KEY_B64 is not set"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::ROCHE_RELEASE_KEY_PASSWORD is not set"; exit 1; }

  release:
    name: Publish the release
    # A version tag (v0.1.0) publishes a signed APK and server binary as a GitHub release,
    # which Obtainium watches, once every check above has passed. Signing needs two repository
    # secrets: ROCHE_RELEASE_KEY_B64 (the PKCS#12 key file, base64) and ROCHE_RELEASE_KEY_PASSWORD.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [signing, lint, test, checks, instrumented, profile]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the GitHub release and upload the APK and server binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build server release binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo build --release --locked -p roche-server
          cp target/release/roche-server "roche-server-$TAG-x86_64-unknown-linux-gnu"
      - name: Write the signing key
        env:
          KEY_B64: ${{ secrets.ROCHE_RELEASE_KEY_B64 }}
        run: printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Fetch the profile the profile job recorded
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: baseline-profile
          path: android/app/src/release/generated/baselineProfiles/
      - name: Build the signed release, with the recorded baseline profile
        env:
          ORG_GRADLE_PROJECT_rocheStoreFile: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_rocheStorePassword: ${{ secrets.ROCHE_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_rocheVersionName: ${{ github.ref_name }}
        run: ./android/gradlew -p android :app:assembleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "roche-$TAG.apk"
          cp android/app/build/outputs/mapping/release/mapping.txt "roche-$TAG-mapping.txt"
          gh release create "$TAG" "roche-$TAG.apk" "roche-$TAG-mapping.txt" "roche-server-$TAG-x86_64-unknown-linux-gnu" --title "Roche $TAG" --generate-notes
