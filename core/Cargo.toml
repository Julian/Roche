[package]
name = "roche-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "3"
flate2 = "1"
ip_network = "0.4"
quick-xml = "0.42"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "macros"], optional = true }
thiserror = "2"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
