[advisories]
ignore = [
    # sqlx-sqlite 0.8.6 pins libsqlite3-sys ^0.30.0 (0.30.1); roche-server only opens its own
    # local database and WAL files, never untrusted database/WAL file pairs.
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
